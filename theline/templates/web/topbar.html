<div class="flex justify-between items-center w-full">
    <div class="relative w-72" id="search-container">
        <div
            class="flex items-center bg-white h-10 w-full px-4 py-2 rounded-md border border-divisorBorder focus-within:border-secundary focus-within:ring-1 focus-within:ring-secundary transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="global-search-input" placeholder="Pesquise produtos, clientes..." autocomplete="off"
                class="bg-transparent outline-none pl-2 w-full text-sm text-gray placeholder-gray2">
        </div>

        <div id="search-dropdown"
            class="absolute top-12 left-0 w-full max-w-md bg-white border border-divisorBorder rounded-lg shadow-xl hidden z-50 overflow-hidden flex-col">

            <div id="search-loading" class="hidden p-4 text-center text-sm text-gray2">
                Buscando...
            </div>

            <ul id="search-results-list" class="flex flex-col max-h-80 overflow-y-auto">
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('global-search-input');
            const searchDropdown = document.getElementById('search-dropdown');
            const searchResultsList = document.getElementById('search-results-list');
            const searchLoading = document.getElementById('search-loading');

            let debounceTimer;

            async function fetchSearchResults(query) {
                if (query.length < 2) {
                    searchDropdown.classList.add('hidden');
                    return;
                }

                searchDropdown.classList.remove('hidden');
                searchResultsList.innerHTML = '';
                searchLoading.classList.remove('hidden');

                try {
                    const response = await fetch(`/api/busca-global/?q=${encodeURIComponent(query)}`);
                    const data = await response.json();

                    renderResults(data.results);
                } catch (error) {
                    console.error("Erro na busca global:", error);
                } finally {
                    searchLoading.classList.add('hidden');
                }
            }

            function renderResults(results) {
                searchResultsList.innerHTML = '';

                if (results.length === 0) {
                    searchResultsList.innerHTML = `<li class="p-4 text-sm text-gray2 text-center">Nenhum resultado encontrado.</li>`;
                    return;
                }

                let currentCategory = '';

                results.forEach(item => {
                    if (item.categoria !== currentCategory) {
                        currentCategory = item.categoria;
                        const categoryHeader = document.createElement('li');
                        categoryHeader.className = "px-4 py-2 text-xs font-bold text-gray2 bg-secundaryWhite uppercase tracking-wider";
                        categoryHeader.textContent = currentCategory;
                        searchResultsList.appendChild(categoryHeader);
                    }

                    const li = document.createElement('li');
                    li.innerHTML = `
                <a href="${item.url}" class="flex items-center px-4 py-3 hover:bg-itemHover hover:text-secundary transition-colors text-sm text-gray cursor-pointer border-b border-divisorBorder last:border-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" class="mr-3 text-gray2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                    ${item.texto}
                </a>
            `;
                    searchResultsList.appendChild(li);
                });
            }

            searchInput.addEventListener('input', function (e) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    fetchSearchResults(e.target.value.trim());
                }, 300);
            });

            document.addEventListener('click', function (e) {
                if (!document.getElementById('search-container').contains(e.target)) {
                    searchDropdown.classList.add('hidden');
                }
            });

            searchInput.addEventListener('focus', function (e) {
                if (e.target.value.trim().length >= 2) {
                    searchDropdown.classList.remove('hidden');
                }
            });
        });
    </script>

    <div class="dropdown dropdown-end">
        <div tabindex="0" role="button"
            class="flex items-center gap-[15px] cursor-pointer hover:opacity-80 transition-opacity">
            <span class="text-gray font-semibold">{{ request.user.username }}</span>
            <div class="w-9 h-9 bg-[#3498db] rounded-full flex items-center justify-center text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>

        <div tabindex="0"
            class="dropdown-content z-[1] mt-4 py-2 px-4 shadow-lg bg-white rounded-xl border border-divisorBorder">

            <div class="flex flex-col mb-3">
                <span class="font-bold text-gray text-base">
                    {% if request.user.get_full_name %}
                    {{ request.user.get_full_name }}
                    {% else %}
                    {{ request.user.username }}
                    {% endif %}
                </span>
                <!-- <span class="text-sm text-gray2 truncate" title="{{ request.user.email }}">
                    {{ request.user.email|default:"Sem e-mail cadastrado" }}
                </span> -->
            </div>

            <div class="h-[1px] bg-divisorBorder w-full mb-2"></div>

            <a href="{% url 'logout' %}"
                class="flex items-center gap-2 text-red font-medium hover:bg-red/10 p-2 rounded-lg transition-colors w-full min-w-32">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Sair
            </a>
        </div>
    </div>

</div>

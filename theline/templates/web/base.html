<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Line - {% block title %}Dashboard{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; }  
        
        /* Menu Lateral */
        nav { width: 250px; height: 100vh; background: #1a1a1a; color: white; position: fixed; }
        nav h2 { text-align: center; padding: 20px 0; border-bottom: 1px solid #333; color: #f4f4f4; }
        nav ul { list-style: none; padding: 0; }
        nav ul li { padding: 15px 25px; border-bottom: 1px solid #222; }
        nav ul li a { color: #ccc; text-decoration: none; display: block; }
        nav ul li a:hover { color: white; }

        /* Área de Conteúdo */
        main { margin-left: 250px; padding: 40px; width: 100%; background: #f9f9f9; min-height: 100vh; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
    </style>
</head>
<body>

    <!-- MENU LATERAL -->
    <nav>
        {% include 'web/menu.html' %}
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        {% block conteudo %}
        <!-- Cada página vai preencher este bloco -->
        {% endblock %}
    </main>

</body>
</html>

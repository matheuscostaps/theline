{% extends "web/base.html" %}

{% block conteudo %}

<section class="card">

    <div class="topo-clientes">
        <h1>Clientes</h1>

        <button class="btn-adicionar">
            + Novo Cliente
        </button>
    </div>

    <table id="tabela-clientes">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Cidade</th>
            </tr>
        </thead>

        <tbody>
            <!-- Clientes carregados via JavaScript -->
        </tbody>

    </table>

</section>

<style>

.topo-clientes{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.btn-adicionar{
    background-color: #111;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-adicionar:hover{
    background-color: #333;
}

#tabela-clientes{
    width: 100%;
    border-collapse: collapse;
    background-color: white;
}

#tabela-clientes th,
#tabela-clientes td{
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
}

#tabela-clientes th{
    background-color: #111;
    color: white;
}

#tabela-clientes tr:nth-child(even){
    background-color: #f5f5f5;
}

#tabela-clientes tr:hover{
    background-color: #ececec;
}

</style>

<script>

async function carregarClientes() {

    try {

        const response = await fetch('/api/clientes/');
        const clientes = await response.json();

        const tbody = document.querySelector('#tabela-clientes tbody');

        tbody.innerHTML = '';

        clientes.forEach(cliente => {

            const tr = document.createElement('tr');

            tr.innerHTML = `
                <td>${cliente.id}</td>
                <td>${cliente.nome}</td>
                <td>${cliente.email}</td>
                <td>${cliente.telefone}</td>
                <td>${cliente.cidade}</td>
            `;

            tbody.appendChild(tr);

        });

    } catch(error) {

        console.error('Erro ao carregar clientes:', error);

    }

}

carregarClientes();

</script>

{% endblock %}
